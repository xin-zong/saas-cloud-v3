schema: spec-driven
context: |
  所有规格、任务、验收记录使用中文。只修改 develop-toyingzhen 与 ems_cloud_saas_toyingzhen。
  QUDEOX 的同站同页实屏是布局、字段、按钮、交互的依据；不能用通用组件替代业务布局。
  Tabler/shadcn 仅可影响颜色、字体、控件皮肤，不得改变参考布局、尺寸密度、字段、按钮位置或流程。
  用户允许新库持久化 mock；不能把 mock 称为真实在线采样，不得写前端常量代替数据库。
  参考平台只读；禁止保存偏好、修改设置、提交业务或下发设备控制；有自动写入的页面仅离线核验。
  main 的 EnergyFlowDiagram.tsx 和 EnergyFlow3D.tsx 固定为保留基线，不修改组件实现。
  保留现有权限系统；原库和线上服务不得修改。禁止读取 Figma 作为设计依据。
rules:
  specs:
    - 每项 SHALL 要有可执行的 WHEN/THEN 验收场景。
    - 区分实屏核验、源码核验、未知；未知不能伪称已实现。
  tasks:
    - 按模块串行完成证据、数据、接口、页面、交互、实屏验收；没有实屏验收不得勾选完成。
    - 每模块记录数据库值、API值、页面值三方对照和截图路径。
