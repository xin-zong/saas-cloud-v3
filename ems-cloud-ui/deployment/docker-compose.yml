name: enerlution-cloud

services:
  web:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-80}:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1/healthz | grep -q '^ok$'",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
