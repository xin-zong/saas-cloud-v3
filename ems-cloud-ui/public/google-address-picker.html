<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company address</title><style>html,body,#map{height:100%;margin:0}#search{position:absolute;top:10px;left:10px;right:10px;z-index:1;background:white;border-radius:8px;padding:4px;max-width:500px}</style></head><body><div id="map"></div><div id="search"></div><script>
let loading=false,map,marker;const tell=(type,value)=>parent.postMessage({source:'ems-address-picker',type,value},location.origin);
window.addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin||e.data?.source!=='ems-address-host'||loading)return;loading=true;const data=e.data;window.gm_authFailure=()=>tell('error');window.initAddress=async()=>{try{const {PlaceAutocompleteElement}=await google.maps.importLibrary('places');const styles=await (await fetch('/google-map-style.json')).json();map=new google.maps.Map(document.getElementById('map'),{center:{lat:50,lng:10},zoom:4,styles,mapTypeControl:false,streetViewControl:false,fullscreenControl:false});const input=new PlaceAutocompleteElement();document.getElementById('search').appendChild(input);const resolve=async place=>{await place.fetchFields({fields:['addressComponents','formattedAddress','location']});if(!place.location)return;map.setCenter(place.location);map.setZoom(15);if(marker)marker.setMap(null);marker=new google.maps.Marker({map,position:place.location});const parts=place.addressComponents??[];const component=type=>parts.find(p=>p.types.includes(type))?.longText??'';tell('selected',{country:component('country'),province:component('administrative_area_level_1'),city:component('locality')||component('administrative_area_level_2'),address:place.formattedAddress??'',postcode:component('postal_code'),latitude:place.location.lat(),longitude:place.location.lng()})};input.addEventListener('gmp-select',async event=>{try{await resolve(event.placePrediction.toPlace())}catch{tell('error')}});map.addListener('click',async event=>{try{const results=await new google.maps.Geocoder().geocode({location:event.latLng});const first=results.results[0];if(!first?.place_id)return;const {Place}=await google.maps.importLibrary('places');await resolve(new Place({id:first.place_id}))}catch{tell('error')}});tell('loaded')}catch{tell('error')}};const params=new URLSearchParams({key:data.key,loading:'async',callback:'initAddress',language:data.language,v:'quarterly'});const script=document.createElement('script');script.src='https://maps.googleapis.com/maps/api/js?'+params;script.onerror=()=>tell('error');document.head.appendChild(script)});tell('ready');
</script></body></html>
