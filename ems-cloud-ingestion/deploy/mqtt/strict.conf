# Independent process; no include_dir and no legacy listeners/bridge.
listener 8884 0.0.0.0
protocol mqtt
allow_anonymous false
require_certificate true
use_identity_as_username false
use_username_as_clientid false
cafile /etc/ems-cloud-v3/broker-tls/client-ca.crt
certfile /etc/ems-cloud-v3/broker-tls/server.crt
keyfile /etc/ems-cloud-v3/broker-tls/server.key
tls_version tlsv1.2
plugin /opt/ems-cloud-v3/current/ems_identity.so
plugin_opt_cloud_identity ems-cloud-v3-ingestion
acl_file /etc/ems-cloud-v3/mqtt.acl
message_size_limit 131072
# Mosquitto 2.0.18 ingress checks remaining_length+1, omitting the three
# Remaining Length encoding bytes at this size. 147453 enforces the approved
# complete PUBLISH packet ceiling of 147456 bytes. Remeasure on version change.
max_packet_size 147453
max_queued_messages 1000
max_queued_bytes 16777216
max_inflight_messages 20
persistence true
persistence_location /var/lib/ems-cloud-v3-mqtt/
autosave_interval 60
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
